# ---------------------------------------------------------------------
#  CASE STUDIES (the big Problem / Approach / Learning panels)
#  They show in this order. "featured: true" adds a "Featured" tag.
#  "stats" is optional: a row of big numbers.
#  "images" is optional: file names from the images folder, with a short
#  description for screen readers (alt).
